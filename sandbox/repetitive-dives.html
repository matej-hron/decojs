<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repetitive Dives — DecoJS Sandbox</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
  <style>
    .trip { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .dive-card { border: 1px solid var(--border-color, #ccc); border-radius: 8px; margin: 1rem 0; padding: 1rem; }
    .dive-card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .dive-meta { font-size: .9rem; opacity: .85; margin-bottom: .5rem; }
    .conflict { color: #b00; font-weight: 600; }
    .chart-host { height: 320px; }
    /* Detail-view charts need real vertical room — the P-P (M-value) and GF
       diagrams collapse to a line at the 320px overview height. Mirror the
       standalone sandbox sizes (profile 600 / M-value & GF 700). */
    #dv-profile { height: 560px; }
    #dv-mvalue, #dv-gf { height: 700px; }
    .presat-strip-wrap { max-width: 480px; }
    .presat-strip { display:flex; align-items:flex-end; gap:2px; height:80px;
                    border-bottom:1px solid var(--border-color,#ccc); }
    .presat-bar { flex:1 1 0; min-height:1px; border-radius:2px 2px 0 0; }
    .presat-axis { display:flex; justify-content:space-between; font-size:.75rem; opacity:.7; }
    .runtime-table { border-collapse:collapse; width:100%; max-width:560px; font-size:.9rem; }
    .runtime-table th, .runtime-table td { border:1px solid var(--border-color,#ccc); padding:.25rem .5rem; text-align:right; }
    .runtime-table th:first-child, .runtime-table td:first-child { text-align:left; }
    .runtime-table tr.is-stop { font-weight:600; }
    .view-detail, .back-to-trip { margin-top:.5rem; cursor:pointer; }
    .trip-calendar { display:flex; gap:8px; align-items:stretch; min-height:420px; margin:1rem 0; }
    .tc-day { position:relative; flex:1 1 0; min-width:120px; border:1px solid var(--border-color,#ccc);
              border-radius:6px; background:var(--surface,#fafafa); cursor:crosshair; }
    .tc-block { position:absolute; left:4px; right:4px; box-sizing:border-box; padding:2px 4px;
                font-size:.75rem; color:#fff; background:#2980b9; border-radius:4px; overflow:hidden;
                cursor:pointer; }
    .tc-block.tc-conflict { background:#c0392b; outline:2px solid #c0392b; }
    .dep-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:.5rem; }
    .dep-remove { color:#c0392b; cursor:pointer; }
  </style>
</head>
<body>
  <nav id="nav-placeholder"></nav>

  <div class="trip">
    <h1>Repetitive Dive Planner — preview</h1>
    <p>Each panel is one dive in the trip. Surface intervals off-gas the tissues;
       later dives start pre-saturated and accrue more decompression.</p>
    <div id="panels"></div>
    <div id="detail" style="display:none;"></div>
  </div>

  <script src="../js/nav.js" type="module"></script>
  <script type="module">
    import { DiveProfileChart } from '../js/charts/DiveProfileChart.js';
    import { MValueChart } from '../js/charts/MValueChart.js';
    import { GFChart } from '../js/charts/GFChart.js';
    import { planTrip } from '../js/tripPlanner.js';
    import { surfacingGF } from '../js/preSaturation.js';
    import { buildRuntimeRows, renderRuntimeTable } from '../js/components/RuntimeTable.js';
    import { COMPARTMENTS } from '../js/tissueCompartments.js';

    const gases = [{ id: 'bottom', name: 'Air', o2: 0.2098, n2: 0.7902, he: 0,
                     cylinderVolume: 12, startPressure: 200 }];

    // Three identical 40 m / 30 min air dives on one day with short surface
    // intervals — each starts more pre-saturated than the last, so deco grows.
    const setup = {
      gases, gfLow: 100, gfHigh: 100, reservePressure: 50,
      // startDateTime is epoch MINUTES (minute 0 = start of the trip's first day).
      dives: [
        { id: 'd1', startDateTime:  9 * 60, maxDepth: 40, bottomTime: 30 }, // 09:00
        { id: 'd2', startDateTime: 11 * 60, maxDepth: 40, bottomTime: 30 }, // 11:00 (~1h SI)
        { id: 'd3', startDateTime: 13 * 60, maxDepth: 40, bottomTime: 30 }  // 13:00 (~40m SI)
      ]
    };

    const fmtClock = (epochMin) => {
      const day = Math.floor(epochMin / (24 * 60)) + 1;
      const mins = epochMin % (24 * 60);
      const hh = String(Math.floor(mins / 60)).padStart(2, '0');
      const mm = String(mins % 60).padStart(2, '0');
      return `Day ${day} ${hh}:${mm}`;
    };
    const fmtDur = (m) => {
      const r = Math.round(m);
      return r >= 60 ? `${Math.floor(r / 60)}h ${r % 60}m` : `${r}m`;
    };

    const trip = planTrip(setup);
    const conflictIds = new Set(trip.conflicts.map(c => c.diveId));
    const panels = document.getElementById('panels');

    trip.dives.forEach(d => {
      const card = document.createElement('div');
      card.className = 'dive-card';

      const si = d.surfaceIntervalBefore == null
        ? 'first dive'
        : (conflictIds.has(d.id)
            ? `<span class="conflict">⚠ overlaps previous dive's deco</span>`
            : `surface interval ${fmtDur(d.surfaceIntervalBefore)}`);

      const presat = d.surfaceIntervalBefore == null ? null : surfacingGF(d.startingTissue);
      const pre = presat == null
        ? 'fresh'
        : `pre-load ${Math.round(presat.controllingPct)}% (tissue #${presat.controllingCompartmentId})`;

      card.innerHTML = `
        <h2>${d.id.toUpperCase()} — ${fmtClock(d.startDateTime)}</h2>
        <div class="dive-meta">${si} · deco ${fmtDur(d.profile.totalDecoTime)}
          · ${d.profile.decoStops.length} stop(s) · ${pre}</div>
        <div class="chart-host"></div>
        <button class="view-detail" data-dive="${d.id}">View detail →</button>`;
      panels.appendChild(card);

      const perDiveSetup = { ...setup, dives: [{ waypoints: d.profile.waypoints }], initialTissuePressures: d.startingTissue };
      new DiveProfileChart(card.querySelector('.chart-host'), {
        diveSetup: perDiveSetup,
        options: { showLabels: true, showCeiling: true }
      });

      card.querySelector('.view-detail').addEventListener('click', () => showDetail(d.id));
    });

    const overview = document.getElementById('panels');
    const detail = document.getElementById('detail');

    let detailCharts = [];
    function disposeDetail() {
      detailCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
      detailCharts = [];
    }

    function showOverview() {
      detail.style.display = 'none';
      disposeDetail();
      detail.innerHTML = '';
      overview.style.display = '';
      window.scrollTo(0, 0);
    }

    function presatStrip(startingTissue) {
      const per = surfacingGF(startingTissue).perCompartmentPct;
      const bars = COMPARTMENTS.map(c => {
        const pct = Math.min(100, per[c.id] || 0);
        return `<span class="presat-bar" title="#${c.id} (${c.halfTime}min): ${Math.round(pct)}%"
                   style="height:${pct}%;background:${c.color};"></span>`;
      }).join('');
      return `<div class="presat-strip-wrap">
                <div class="presat-strip">${bars}</div>
                <div class="presat-axis"><span>fast</span><span>slow</span></div>
              </div>`;
    }

    function showDetail(diveId) {
      const d = trip.dives.find(x => x.id === diveId);
      if (!d) return;
      disposeDetail();
      overview.style.display = 'none';
      detail.style.display = '';

      const seededSetup = { ...setup, dives: [{ waypoints: d.profile.waypoints }], initialTissuePressures: d.startingTissue };
      const siLine = d.surfaceIntervalBefore == null ? 'first dive' : `surface interval ${fmtDur(d.surfaceIntervalBefore)}`;

      detail.innerHTML = `
        <button class="back-to-trip">← back to trip</button>
        <h2>${d.id.toUpperCase()} — ${fmtClock(d.startDateTime)}</h2>
        <div class="dive-meta">${siLine} · deco ${fmtDur(d.profile.totalDecoTime)}</div>
        <h3>Pre-saturation at start (surfacing GF per tissue)</h3>
        ${d.surfaceIntervalBefore == null ? '<p>Fresh diver — no residual loading.</p>' : presatStrip(d.startingTissue)}
        <h3>Dive profile</h3><div class="chart-host" id="dv-profile"></div>
        <h3>M-value loading</h3><div class="chart-host" id="dv-mvalue"></div>
        <h3>Gradient factor</h3><div class="chart-host" id="dv-gf"></div>
        <h3>Runtime</h3><div id="dv-runtime"></div>`;

      detail.querySelector('.back-to-trip').addEventListener('click', showOverview);

      const profileChart = new DiveProfileChart(detail.querySelector('#dv-profile'), {
        diveSetup: seededSetup, options: { showLabels: true, showCeiling: true }
      });
      const mvalueChart = new MValueChart(detail.querySelector('#dv-mvalue'), {
        diveSetup: seededSetup,
        options: {
          compartments: [1],
          showMValueLines: true,
          showGFLines: true,
          showAmbientLine: true,
          showTrail: true,
          compartmentSelector: true
        }
      });
      const gfChart = new GFChart(detail.querySelector('#dv-gf'), {
        diveSetup: seededSetup,
        options: {
          compartments: [1, 2, 3, 4, 5, 6],
          showTrail: true,
          compartmentSelector: true
        }
      });
      detailCharts.push(profileChart, mvalueChart, gfChart);

      const rows = buildRuntimeRows(d.profile, seededSetup.gases);
      detail.querySelector('#dv-runtime').appendChild(renderRuntimeTable(rows));

      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
