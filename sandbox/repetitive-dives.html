<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repetitive Dives — DecoJS Sandbox</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
  <style>
    /* ── Repetitive Dive Planner — elevated, cohesive with the shared design system.
       "Depth column": time runs vertically like a descent. Uses the site tokens
       (--brand, --surface, --space-*, --radius-*, --shadow-*, --font-display/body).
       Visual layer only — calendar geometry (positions, %, sizes) is preserved. ── */

    .trip { max-width: 960px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-16); }
    .trip > p { color: var(--text-subtle); max-width: 62ch; }

    /* ── Trip-config toolbar ───────────────────────────────────────────── */
    .trip-config {
      display:flex; flex-wrap:wrap; align-items:center; gap: var(--space-5);
      padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4);
      background: var(--surface-elevated); border:1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    }
    .trip-config label { display:flex; align-items:center; gap: var(--space-2);
      font-size: var(--text-sm); font-weight:500; color: var(--text-subtle); }
    .trip-config input[type=number], .trip-config input[type=date] {
      font-family: var(--font-body); font-variant-numeric: tabular-nums; color: var(--text);
      border:1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
      padding: .25rem .45rem; font-size: var(--text-sm);
      transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
    }
    .trip-config input[type=number] { width: 4.5rem; }
    .trip-config input[type=date] { width:auto; }
    .trip-config input:focus { outline:none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--blue-100); }

    .gf-presets { display:flex; flex-wrap:wrap; gap: var(--space-2); align-items:center; }
    .gf-preset-btn, .cfg-copy-btn {
      font-family: var(--font-body); font-size: var(--text-xs); font-weight:600; letter-spacing:.01em;
      padding: .28rem .7rem; cursor:pointer; color: var(--text-subtle);
      border:1px solid var(--border); border-radius: var(--radius-full); background: var(--surface);
      transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
    }
    .gf-preset-btn:hover, .cfg-copy-btn:hover { color: var(--brand); border-color: var(--blue-200); background: var(--blue-50); }

    /* ── Calendar — vertical "depth column" ────────────────────────────── */
    .trip-calendar { display:flex; align-items:stretch; gap: var(--space-2); min-height: 460px; margin: var(--space-4) 0; }
    .tc-ruler { position:relative; width: 48px; flex: 0 0 48px; }
    .tc-hour-label { position:absolute; right: var(--space-2); transform:translateY(-50%);
      font-size: var(--text-xs); color: var(--text-subtle); font-variant-numeric: tabular-nums; letter-spacing:.02em; }
    .tc-day {
      position:relative; flex:1 1 0; min-width:124px; padding-top: 22px; overflow:hidden; cursor:crosshair;
      border:1px solid var(--border); border-radius: var(--radius-md);
      background: linear-gradient(180deg, var(--surface) 0%, var(--blue-50) 100%);
      box-shadow: inset 0 1px 3px rgba(13,45,66,.05);
    }
    .tc-day-header {
      position:absolute; top:0; left:0; right:0; height:20px; line-height:20px; text-align:center;
      font-family: var(--font-display); font-size: var(--text-xs); font-weight:600; letter-spacing:.03em;
      color: var(--text-subtle); background: var(--surface-elevated);
      border-bottom:1px solid var(--border); border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .tc-hour-line { position:absolute; left:0; right:0; border-top:1px solid var(--blue-100); opacity:.6; pointer-events:none; }

    /* Dive blocks — refined cards floating in the column */
    .tc-block {
      position:absolute; left:5px; right:5px; box-sizing:border-box; min-height: 2.6em; overflow:hidden;
      padding: 4px 7px;
      font-family: var(--font-body); font-size: var(--text-xs); font-weight:600; line-height:1.3;
      font-variant-numeric: tabular-nums; color: var(--text-inverse); text-shadow: 0 1px 1px rgba(11,45,66,.28);
      background: var(--brand); border-radius: var(--radius-sm); border-left: 3px solid rgba(255,255,255,.55);
      box-shadow: var(--shadow-sm); cursor: grab;
      /* The block owns the touch gesture so a touch-drag reschedules instead of being
         swallowed by the browser as a scroll. (No effect with a mouse.) */
      touch-action: none;
      transition: box-shadow var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
    }
    .tc-block:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .tc-block.tc-dragging { opacity:.92; z-index:3; cursor:grabbing; box-shadow: var(--shadow-lg); transform:none; }
    .tc-block.tc-conflict { background: var(--red-500); border-left-color: rgba(255,255,255,.65); }
    .tc-block.tc-invalid {
      background: repeating-linear-gradient(45deg, var(--gray-500), var(--gray-500) 6px, var(--gray-400) 6px, var(--gray-400) 12px);
      border-left-color: var(--amber-500); outline:1px dashed var(--amber-500);
    }
    .tc-block.tc-selected { outline:2px solid var(--amber-500); outline-offset:1px; box-shadow: var(--shadow-md); z-index:2; }

    /* ── Selected-dive panel — elevated card ───────────────────────────── */
    #selected:not(:empty) {
      background: var(--surface-elevated); border:1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      padding: var(--space-5); margin-top: var(--space-5);
    }
    .sel-header { display:flex; justify-content:space-between; align-items:center; gap: var(--space-4); }
    .sel-header h2 { margin:0; font-family: var(--font-display); font-size: var(--text-xl); font-weight:600;
      color: var(--text); letter-spacing:-.01em; }
    .sel-actions { display:flex; gap: var(--space-2); }
    .sel-actions button {
      cursor:pointer; font-family: var(--font-body); font-size: var(--text-sm); font-weight:600;
      padding: .32rem .85rem; color: var(--text-subtle);
      border:1px solid var(--border); border-radius: var(--radius-full); background: var(--surface);
      transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
    }
    .sel-actions button:hover { color: var(--brand); border-color: var(--blue-200); background: var(--blue-50); }
    .sel-delete { color: var(--red-500); }
    .sel-delete:hover { color: var(--red-500); border-color: #f0b4ab; background: #fdecea; }

    .dive-meta { font-size: var(--text-sm); color: var(--text-subtle); font-variant-numeric: tabular-nums;
      line-height: var(--leading-normal); margin: var(--space-2) 0 var(--space-4); }
    .invalid-note { margin: var(--space-3) 0; padding: var(--space-3) var(--space-4);
      border:1px dashed var(--amber-500); border-radius: var(--radius-md);
      background: #fff8f0; color: #8a5300; font-size: var(--text-sm); }
    .conflict { color: var(--red-500); font-weight:600; }

    .sel-edit-form { margin: var(--space-3) 0; padding: var(--space-3) var(--space-4);
      background: var(--surface-sunken); border:1px solid var(--border); border-radius: var(--radius-md); }
    /* The selected-panel header already has a 🗑 Delete; hide the edit form's own Remove button. */
    .sel-edit-form .dep-remove { display:none; }
    .dep-header { font-family: var(--font-display); font-weight:600; margin-bottom: var(--space-2); color: var(--text); }
    .dep-row { display:flex; flex-wrap:wrap; align-items:center; gap: var(--space-4); margin-bottom: var(--space-2); }
    .dep-remove { color: var(--red-500); cursor:pointer; }
    .dep-lock-label { display:inline-flex; align-items:center; gap: var(--space-1); white-space:nowrap; }

    .sel-full { margin-top: var(--space-4); border-top:1px solid var(--border); padding-top: var(--space-2); }
    .sel-full > summary { cursor:pointer; font-family: var(--font-display); font-weight:600; font-size: var(--text-md); color: var(--text); padding: var(--space-2) 0; }
    .mode-toggles { display:flex; flex-wrap:wrap; gap: var(--space-3); font-size: var(--text-xs); color: var(--text-subtle); margin: var(--space-3) 0; }
    .mode-toggles label { display:inline-flex; align-items:center; gap: var(--space-1); cursor:pointer; }

    /* Pre-saturation strip — full-height hover columns with an instant value tooltip */
    .presat-strip-wrap { max-width: 480px; overflow: visible; padding-top: 1.9rem; }
    .presat-strip { display:flex; align-items:flex-end; gap:2px; height:80px; border-bottom:1px solid var(--border-strong); }
    .presat-col { position:relative; flex:1 1 0; height:100%; display:flex; align-items:flex-end; cursor:default; }
    .presat-fill { width:100%; min-height:1px; border-radius:2px 2px 0 0; transition: filter var(--duration-fast) var(--ease-out); }
    .presat-col:hover .presat-fill { filter: brightness(0.82); outline:1px solid var(--surface); outline-offset:-1px; }
    .presat-col:hover::after {
      content: attr(data-tip);
      position:absolute; left:50%; bottom:calc(100% + 5px); transform:translateX(-50%);
      background: var(--gray-800); color: var(--text-inverse);
      font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space:nowrap;
      padding:.2rem .5rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
      pointer-events:none; z-index:5;
    }
    .presat-axis { display:flex; justify-content:space-between; font-size: var(--text-xs); color: var(--text-subtle); }

    /* Runtime table */
    .runtime-table { border-collapse:collapse; width:100%; max-width:560px; font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
    .runtime-table th, .runtime-table td { border:1px solid var(--border); padding:.3rem .55rem; text-align:right; }
    .runtime-table th { background: var(--surface-sunken); color: var(--text-subtle); font-weight:600; }
    .runtime-table th:first-child, .runtime-table td:first-child { text-align:left; }
    .runtime-table tr.is-stop { font-weight:600; color: var(--brand-strong); }

    /* Chart hosts — geometry preserved */
    .chart-host { height: 320px; }
    #selected .chart-host { height:auto; min-height:320px; display:flex; flex-direction:column; }
    #selected .chart-host .dpc-chart-container { flex:0 0 320px; min-height:0; }
    #sel-profile { min-height:560px; }
    #sel-profile .dpc-chart-container { flex:0 0 560px; }
    #sel-mvalue, #sel-gf { min-height:700px; }
    #sel-mvalue .dpc-chart-container, #sel-gf .dpc-chart-container { flex:0 0 700px; }

    /* ── Add-dive dialog ───────────────────────────────────────────────── */
    .add-dialog-backdrop { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
      background: rgba(11,45,66,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .add-dialog { background: var(--surface-elevated); padding: var(--space-5); border-radius: var(--radius-lg);
      min-width: 320px; box-shadow: var(--shadow-lg); display:flex; flex-direction:column; gap: var(--space-3); }
    .add-dialog h3 { margin:0; font-family: var(--font-display); font-size: var(--text-lg); color: var(--text); }
    .add-dialog label { font-size: var(--text-sm); color: var(--text-subtle); display:flex; align-items:center; gap: var(--space-2); }
    .add-dialog input { font-family: var(--font-body); font-variant-numeric: tabular-nums;
      border:1px solid var(--border); border-radius: var(--radius-sm); padding:.3rem .45rem; }
    .ad-modes { display:flex; flex-direction:column; gap: var(--space-2); }
    .ad-hint { font-size: var(--text-sm); color: var(--text-subtle); min-height:1.2em; }
    .ad-actions { display:flex; justify-content:flex-end; gap: var(--space-2); margin-top: var(--space-1); }

    /* ── Phone: the multi-day calendar doesn't fit a narrow screen, so make it
       scroll horizontally (swipe between days) instead of overflowing the page.
       Columns keep a readable fixed width and snap; the ruler narrows. Rescheduling
       also works via the selected-dive panel's Start field as a no-drag fallback. ── */
    @media (max-width: 560px) {
      .trip { padding: var(--space-4) var(--space-3) var(--space-12); }
      .trip-calendar { overflow-x: auto; -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity; gap: var(--space-1); }
      .tc-ruler { width: 36px; flex: 0 0 36px; }
      .tc-day { flex: 0 0 134px; min-width: 134px; scroll-snap-align: start; }
      .tc-hour-label { font-size: 0.65rem; }
      .trip-config { gap: var(--space-3); }
      #selected:not(:empty) { padding: var(--space-4); }
    }

    /* One-time page-load entrance for the persistent chrome (config bar + calendar
       CONTAINER). Never applied to .tc-day/.tc-block, which re-render on every edit. */
    @media (prefers-reduced-motion: no-preference) {
      .trip-config { animation: planner-rise var(--duration-slow) var(--ease-out) both; }
      .trip-calendar { animation: planner-rise var(--duration-slow) var(--ease-out) both; animation-delay: 70ms; }
    }
    @keyframes planner-rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <nav class="main-nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Deco Theory</a>
      <button class="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links"><!-- generated by js/nav.js --></ul>
      <span class="nav-wip-badge">Experimental</span>
    </div>
  </nav>

  <div class="trip">
    <h1>Repetitive Dive Planner — preview</h1>
    <p>Each panel is one dive in the trip. Surface intervals off-gas the tissues;
       later dives start pre-saturated and accrue more decompression.</p>
    <div class="trip-config">
      <label>GF Low <input id="cfg-gflow" type="number" value="100" min="1" max="100"></label>
      <label>GF High <input id="cfg-gfhigh" type="number" value="100" min="1" max="100"></label>
      <span class="gf-presets"></span>
      <label>Start date <input id="cfg-start" type="date" value="2026-06-15"></label>
      <label>Days <input id="cfg-days" type="number" min="1" max="14" value="3"></label>
      <button id="cfg-copy" class="cfg-copy-btn">Copy trip link</button>
    </div>
    <div id="calendar"></div>
    <div id="selected"></div>
    <div id="add-dialog"></div>
  </div>

  <script src="../js/nav.js" type="module"></script>
  <script type="module">
    import { DiveProfileChart } from '../js/charts/DiveProfileChart.js';
    import { MValueChart } from '../js/charts/MValueChart.js';
    import { GFChart } from '../js/charts/GFChart.js';
    import { planTrip } from '../js/tripPlanner.js';
    import { preSaturation } from '../js/preSaturation.js';
    import { buildRuntimeRows, renderRuntimeTable } from '../js/components/RuntimeTable.js';
    import { COMPARTMENTS } from '../js/tissueCompartments.js';
    import { TripCalendar } from '../js/components/TripCalendar.js';
    import { DiveEditPanel } from '../js/components/DiveEditPanel.js';
    import { addDive, editDive, removeDive, rescheduleDive } from '../js/tripState.js';
    import { AddDiveDialog } from '../js/components/AddDiveDialog.js';
    import { previewNdl } from '../js/ndlPreview.js';
    import { GF_PRESETS } from '../js/gfPresets.js';
    import { getTripFromUrl, updateUrlWithTrip, getTripShareUrl } from '../js/tripUrl.js';

    const air = [{ id: 'bottom', name: 'Air', o2: 0.2098, n2: 0.7902, he: 0,
                   cylinderVolume: 12, startPressure: 200 }];

    // Mutable trip state — this is the INPUT to planTrip.
    let trip = {
      startDate: '2026-06-15',
      dayCount: 3,
      gases: air,
      gfLow: 100,
      gfHigh: 100,
      reservePressure: 50,
      dives: [
        { id: 'd1', name: 'Dive 1', startDateTime:  9 * 60, maxDepth: 40, bottomTime: 30, gases: air }, // 09:00
        { id: 'd2', name: 'Dive 2', startDateTime: 11 * 60, maxDepth: 40, bottomTime: 30, gases: air }, // 11:00
        { id: 'd3', name: 'Dive 3', startDateTime: 13 * 60, maxDepth: 40, bottomTime: 30, gases: air }  // 13:00
      ]
    };

    const urlTrip = getTripFromUrl();
    if (urlTrip) {
      trip = urlTrip;
      // Sync form inputs to match the restored trip values.
      document.getElementById('cfg-gflow').value  = trip.gfLow  ?? 100;
      document.getElementById('cfg-gfhigh').value = trip.gfHigh ?? 100;
      if (trip.startDate) document.getElementById('cfg-start').value = trip.startDate;
      document.getElementById('cfg-days').value   = trip.dayCount ?? 3;
    }

    const fmtClock = (epochMin) => {
      const day = Math.floor(epochMin / (24 * 60)) + 1;
      const mins = epochMin % (24 * 60);
      const hh = String(Math.floor(mins / 60)).padStart(2, '0');
      const mm = String(mins % 60).padStart(2, '0');
      return `Day ${day} ${hh}:${mm}`;
    };
    const fmtDur = (m) => {
      const r = Math.round(m);
      return r >= 60 ? `${Math.floor(r / 60)}h ${r % 60}m` : `${r}m`;
    };
    // Escape user-controlled text before interpolating into innerHTML.
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

    // planTrip result (updated on every rerender).
    let lastResult = null;
    let selectedDiveId = null;
    let calcTimer = null;

    // ── Shared profile display-mode state ───────────────────────────────────
    const profileModes = { showTissueLoading: false, showPartialPressures: false, showAmbientPressure: false, showGasConsumption: false };

    const MODE_LABELS = [
      ['showTissueLoading', 'Tissue'],
      ['showPartialPressures', 'ppO₂/N₂'],
      ['showAmbientPressure', 'Ambient'],
      ['showGasConsumption', 'Gas use']
    ];
    function buildModeToggles() {
      const wrap = document.createElement('div');
      wrap.className = 'mode-toggles';
      MODE_LABELS.forEach(([key, label]) => {
        const lab = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = profileModes[key];
        cb.addEventListener('change', () => { profileModes[key] = cb.checked; reRenderProfiles(); });
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(' ' + label));
        wrap.appendChild(lab);
      });
      return wrap;
    }
    function reRenderProfiles() {
      renderSelected(); // single view now — re-render picks up the new modes
    }

    const calendar   = new TripCalendar(document.getElementById('calendar'));
    const addDialog  = new AddDiveDialog(document.getElementById('add-dialog'));
    const selectedHost = document.getElementById('selected');

    const INVALID_NDL_HTML = `<div class="invalid-note">⚠ No-deco dive not possible here — too pre-saturated. Move it later or unlock to a custom dive.</div>`;

    // ── Selected-dive panel (master–detail) ─────────────────────────────────
    let selectedCharts = [];
    let editingOpen = false;
    let editPanel = null;
    let fullAnalysisOpen = false;

    function disposeSelected() {
      selectedCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
      selectedCharts = [];
      // Dispose any open edit panel before its DOM is overwritten, so its
      // DiveSetupEditor document listener isn't leaked on switch-away-while-editing.
      if (editPanel) { editPanel.close(); editPanel = null; }
    }

    function renderSelected() {
      disposeSelected();
      if (!lastResult || !lastResult.dives.length) { selectedHost.innerHTML = ''; return; }
      if (!selectedDiveId || !lastResult.dives.some(x => x.id === selectedDiveId)) {
        selectedDiveId = lastResult.dives[0].id;
      }
      const d = lastResult.dives.find(x => x.id === selectedDiveId);
      const siLine = d.surfaceIntervalBefore == null ? 'first dive' : `SI ${fmtDur(d.surfaceIntervalBefore)}`;
      const headerHtml = `
        <div class="sel-header">
          <h2>${esc(d.name || d.id.toUpperCase())} — ${fmtClock(d.startDateTime)}</h2>
          <div class="sel-actions"><button class="sel-edit">✎ Edit</button><button class="sel-delete">🗑 Delete</button></div>
        </div>`;

      if (d.invalid) {
        selectedHost.innerHTML = headerHtml
          + `<div class="dive-meta">${siLine} · ${d.maxDepth}m · invalid</div>`
          + INVALID_NDL_HTML
          + '<h3>Pre-saturation at start (% toward surfacing limit, per tissue)</h3>'
          + (d.surfaceIntervalBefore == null ? '<p>Fresh diver — no residual loading.</p>' : presatStrip(d.startingTissue))
          + '<div class="sel-edit-form"></div>';
        wireSelectedActions(d); if (editingOpen) openEditForm(d);
        return;
      }

      const runtime = Math.round(d.endDateTime - d.startDateTime);
      const tts = Math.round(runtime - d.bottomTime);
      const deco = d.profile.totalDecoTime;
      const stops = d.profile.decoStops || [];
      const deepest = stops.length ? Math.max(...stops.map(s => s.depth)) : null;
      const presat = d.surfaceIntervalBefore == null ? null : preSaturation(d.startingTissue);
      const parts = [siLine, `${d.maxDepth}m`, `${Math.round(d.bottomTime)}min bottom`, `${runtime}min runtime`];
      if (deco > 0) {
        parts.push(`+${Math.round(deco)}min deco`);
        if (deepest != null) parts.push(`first stop ${deepest}m`);
        parts.push(`TTS ${tts}min`);
      } else {
        parts.push('no-deco');
      }
      if (presat) parts.push(`pre-load ${Math.round(presat.controllingPct)}% (#${presat.controllingCompartmentId})`);

      selectedHost.innerHTML = headerHtml
        + `<div class="dive-meta">${parts.join(' · ')}</div>`
        + (d.surfaceIntervalBefore == null ? '' : presatStrip(d.startingTissue))
        + '<div class="sel-edit-form"></div>'
        + '<div id="sel-modes"></div><div class="chart-host" id="sel-profile"></div>'
        + `<details class="sel-full"${fullAnalysisOpen ? ' open' : ''}><summary>Full analysis (M-value, GF, runtime)</summary><div class="sel-full-body"></div></details>`;

      document.getElementById('sel-modes').appendChild(buildModeToggles());

      const diveGases = (trip.dives.find(td => td.id === d.id)?.gases) ?? trip.gases;
      const seededSetup = {
        ...trip, gases: diveGases,
        dives: [{ waypoints: d.profile.waypoints }],
        surfaceInterval: 0, initialTissuePressures: d.startingTissue,
        sacRate: 20, decoSacRate: 15
      };

      const profileChart = new DiveProfileChart(selectedHost.querySelector('#sel-profile'), {
        diveSetup: seededSetup, options: { showLabels: true, showCeiling: true, showLegend: false, ...profileModes }
      });
      selectedCharts.push(profileChart);

      const details = selectedHost.querySelector('.sel-full');
      const buildFull = () => {
        const body = details.querySelector('.sel-full-body');
        if (body.dataset.built) return;
        body.dataset.built = '1';
        body.innerHTML = '<h3>M-value loading</h3><div class="chart-host" id="sel-mvalue"></div>'
          + '<h3>Gradient factor</h3><div class="chart-host" id="sel-gf"></div>'
          + '<h3>Runtime</h3><div id="sel-runtime"></div>';
        const mvalueChart = new MValueChart(body.querySelector('#sel-mvalue'), {
          diveSetup: seededSetup,
          options: { compartments: [1], showMValueLines: true, showGFLines: true, showAmbientLine: true, showTrail: true, compartmentSelector: true }
        });
        const gfChart = new GFChart(body.querySelector('#sel-gf'), {
          diveSetup: seededSetup,
          options: { compartments: [1, 2, 3, 4, 5, 6], showTrail: true, compartmentSelector: true }
        });
        selectedCharts.push(mvalueChart, gfChart);
        const rows = buildRuntimeRows(d.profile, seededSetup.gases);
        body.querySelector('#sel-runtime').appendChild(renderRuntimeTable(rows));
      };
      details.addEventListener('toggle', () => { fullAnalysisOpen = details.open; if (details.open) buildFull(); });
      if (fullAnalysisOpen) buildFull();
      wireSelectedActions(d); if (editingOpen) openEditForm(d);
    }

    function deleteDive(id) {
      trip = removeDive(trip, id);
      editingOpen = false;
      selectedDiveId = (trip.dives[0] && trip.dives[0].id) || null;
      rerender();
    }

    function openEditForm(d) {
      const formHost = selectedHost.querySelector('.sel-edit-form');
      if (!formHost) return;
      if (editPanel) { editPanel.close(); editPanel = null; }   // dispose any prior panel's listeners
      editPanel = new DiveEditPanel(formHost);
      editPanel.addEventListener('apply', (e) => {
        trip = editDive(trip, e.detail.id, e.detail.patch);
        rerenderDeferred();
      });
      editPanel.addEventListener('remove', () => deleteDive(d.id));
      const raw = trip.dives.find(td => td.id === d.id);
      if (raw) editPanel.open(raw, trip.startDate, d.bottomTime);
    }

    function wireSelectedActions(d) {
      const editBtn = selectedHost.querySelector('.sel-edit');
      const delBtn = selectedHost.querySelector('.sel-delete');
      if (editBtn) editBtn.addEventListener('click', () => {
        editingOpen = !editingOpen;
        if (editingOpen) openEditForm(d);
        else { if (editPanel) editPanel.close(); editPanel = null; }
      });
      if (delBtn) delBtn.addEventListener('click', () => deleteDive(d.id));
    }

    // ── Main render entry point ─────────────────────────────────────────────

    function rerender() {
      clearTimeout(calcTimer);
      lastResult = planTrip(trip);
      const neededDays = Math.max(trip.dayCount || 1, 1,
        ...trip.dives.map(d => Math.floor(d.startDateTime / (24 * 60)) + 1));
      calendar.configure({ startDate: trip.startDate, dayCount: neededDays });
      calendar.render(lastResult, selectedDiveId);
      renderSelected();
      updateUrlWithTrip(trip);
    }
    // Edits commit on field blur, which can fire during a click on another dive.
    // A synchronous rerender then rebuilds the calendar mid-click and swallows the
    // selection. Defer the edit-triggered rerender off the blur/click path.
    function rerenderDeferred() {
      clearTimeout(calcTimer);
      calcTimer = setTimeout(rerender, 250);
    }

    function presatStrip(startingTissue) {
      const per = preSaturation(startingTissue).perCompartmentPct;
      // Full-height hover column (easy target even for short bars); the coloured fill is the
      // value; the tooltip shows the actual (unclamped) % so an over-limit tissue reads >100%.
      const cols = COMPARTMENTS.map(c => {
        const raw = per[c.id] || 0;
        const fill = Math.min(100, raw);
        return `<span class="presat-col" data-tip="#${c.id} · ${c.halfTime} min · ${Math.round(raw)}%">
                  <span class="presat-fill" style="height:${fill}%;background:${c.color};"></span>
                </span>`;
      }).join('');
      return `<div class="presat-strip-wrap">
                <div class="presat-strip">${cols}</div>
                <div class="presat-axis"><span>fast</span><span>slow</span></div>
              </div>`;
    }

    // ── Calendar events ─────────────────────────────────────────────────────

    calendar.addEventListener('createAt', (e) => {
      const startDateTime = calendar.toStartDateTime(e.detail.dayIndex, e.detail.minutesOfDay);
      addDialog.open({
        startDateTime,
        startDate: trip.startDate,
        gases: trip.gases,
        defaultDepth: 18,
        defaultTime: 40,
        defaultName: `Dive ${trip.dives.length + 1}`,
        computeNdl: (s, d, g) => previewNdl(trip, { startDateTime: s, maxDepth: d, gases: g }, trip.gfLow)
      });
    });

    addDialog.addEventListener('add', (e) => { trip = addDive(trip, e.detail); rerender(); });

    calendar.addEventListener('reschedule', (e) => {
      trip = rescheduleDive(trip, e.detail.diveId, e.detail.startDateTime);
      selectedDiveId = e.detail.diveId;
      rerender();
    });

    calendar.addEventListener('selectDive', (e) => {
      selectedDiveId = e.detail.diveId;
      editingOpen = false;
      rerender();
    });

    document.getElementById('cfg-gflow').addEventListener('change', (ev) => {
      trip = { ...trip, gfLow: +ev.target.value };
      rerender();
    });

    document.getElementById('cfg-gfhigh').addEventListener('change', (ev) => {
      trip = { ...trip, gfHigh: +ev.target.value };
      rerender();
    });

    const gfPresetsEl = document.querySelector('.gf-presets');
    gfPresetsEl.innerHTML = GF_PRESETS.map(p =>
      `<button class="gf-preset-btn" data-gf-low="${p.gfLow}" data-gf-high="${p.gfHigh}" title="${p.title}">${p.label} ${p.gfLow}/${p.gfHigh}</button>`).join('');
    gfPresetsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.gf-preset-btn');
      if (!btn) return;
      const gfLow = +btn.dataset.gfLow, gfHigh = +btn.dataset.gfHigh;
      trip = { ...trip, gfLow, gfHigh };
      document.getElementById('cfg-gflow').value = gfLow;
      document.getElementById('cfg-gfhigh').value = gfHigh;
      rerender();
    });

    document.getElementById('cfg-start').addEventListener('change', (e) => {
      trip = { ...trip, startDate: e.target.value };
      rerender();
    });

    document.getElementById('cfg-days').addEventListener('change', (e) => {
      trip = { ...trip, dayCount: Math.max(1, +e.target.value) };
      rerender();
    });

    document.getElementById('cfg-copy').addEventListener('click', async (e) => {
      const btn = e.target;
      try {
        await navigator.clipboard.writeText(getTripShareUrl(trip));
        const prev = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = prev; }, 1500);
      } catch (_) { /* clipboard unavailable — the address bar still holds the link */ }
    });

    // ── Initial render ──────────────────────────────────────────────────────
    rerender();
  </script>
</body>
</html>
