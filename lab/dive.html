<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="../css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>

<body class="tr-share-page">
    <header class="tr-top"><div class="tr-top-in nav-container">
        <a class="tr-brand" href="dive-log.html"><svg class="tr-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
            <path class="tr-mark-sea" d="M2 7.5h28"/>
            <path class="tr-mark-trail" d="M4 7.5 9.5 22.5h8l2.5-5.5h3.5l1.8-4.5"/>
            <circle class="tr-mark-dot" cx="27.2" cy="8.6" r="2.9"/>
        </svg><span>DecoTrail</span></a>
        <div class="tr-top-end"><span class="tr-lang"></span><a class="tr-sibling" href="../index.html"><svg class="tr-sibling-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg><span class="tr-sibling-text" data-i18n="diveLog.trail.decotheory">DecoTheory&nbsp;↗</span></a></div>
    </div></header>
    <main class="tr-main"><div class="rda-root tr-share-root"></div></main>
    <footer class="tr-foot">
        <p class="tr-foot-line"><span data-i18n="diveLog.trail.footer">DecoTrail — dives explained by</span> <a href="../index.html" data-i18n="diveLog.trail.decotheory">DecoTheory&nbsp;↗</a></p>
        <p class="tr-foot-note" data-i18n="diveLog.trail.disclaimer">For education only — not a substitute for your dive computer.</p>
        <p class="tr-foot-note"><a href="../privacy.html#logbook" data-i18n="diveLog.backend.privacyLink">Privacy policy</a></p>
        <span class="version-number"></span>
    </footer>
    <script type="module">
        import { initI18n, createLanguageSwitcher } from '../js/i18n.js';
        createLanguageSwitcher(); // attaches to .nav-container; the shell keeps it in .tr-lang
        const switcher = document.querySelector('.tr-top-in > .lang-switcher');
        if (switcher) document.querySelector('.tr-lang').append(switcher);
        initI18n();
    </script>
    <script type="module">
        import { SharedDivePage } from '../js/logbook/SharedDivePage.js';
        import { createShareStore } from '../js/backend/shareStore.js';
        import { parseShareHash } from '../js/logbook/share.js';
        const token = parseShareHash(location.hash);
        new SharedDivePage(document.querySelector('.tr-share-root'), { store: token ? createShareStore(token) : null });
        addEventListener('hashchange', () => location.reload()); // another link pasted into the address bar
    </script>
</body>
</html>
